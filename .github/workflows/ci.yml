name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  frontend-build:
    name: Frontend build (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache template/node_modules
        uses: actions/cache@v4
        with:
          path: template/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('template/bun.lock') }}

      - name: Install dependencies and build frontend
        run: |
          cd template
          bun install --frozen-lockfile
          bun run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: template/build/

  go-test:
    name: Go test
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.0

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: template/build/

      - name: Run tests
        run: |
          go install github.com/jstemmer/go-junit-report/v2@v2.1.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          set +e
          set -o pipefail
          go test -json ./... | tee test-results.json
          test_status=$?
          go-junit-report -set-exit-code < test-results.json > test-results.xml
          report_status=$?
          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi
          exit "$report_status"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  secret-detection:
    name: Secret detection (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-amd64:
    name: Docker image linux/amd64
    runs-on: ubuntu-latest
    needs: [frontend-build, go-test, secret-detection]
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: template/build/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/miyasakun/mixtape
          flavor: |
            suffix=-amd64
          tags: |
            type=sha,format=long

      - name: Build and push linux/amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64

  docker-arm64:
    name: Docker image linux/arm64 (native arm64 runner)
    runs-on: ubuntu-24.04-arm
    needs: [frontend-build, go-test, secret-detection]
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: template/build/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/miyasakun/mixtape
          flavor: |
            suffix=-arm64
          tags: |
            type=sha,format=long

      - name: Build and push linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          pull: true
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=linux-arm64
          cache-to: type=gha,mode=max,scope=linux-arm64

  docker-manifest:
    name: Merge multiarch manifest
    runs-on: ubuntu-latest
    needs: [docker-amd64, docker-arm64]
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine final image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/miyasakun/mixtape
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Merge single-arch images into multiarch manifest
        env:
          SHA_TAG: ghcr.io/miyasakun/mixtape:sha-${{ github.sha }}
        run: |
          # Sources are the per-arch images from the build jobs; type=sha,format=long
          # in those jobs yields exactly sha-<github.sha> with the -<arch> flavor suffix.
          args=()
          while IFS= read -r tag; do
            args+=(-t "$tag")
          done <<< "${{ steps.meta.outputs.tags }}"
          docker buildx imagetools create "${args[@]}" \
            "${SHA_TAG}-amd64" \
            "${SHA_TAG}-arm64"

      - name: Inspect merged manifest
        env:
          SHA_TAG: ghcr.io/miyasakun/mixtape:sha-${{ github.sha }}
        run: docker buildx imagetools inspect "${SHA_TAG}"
