auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true

limits_config:
  retention_period: 336h
  # Pi-sized defaults: small cache, no high-cardinality surprises.
  max_query_lookback: 336h

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_items: 256
        ttl: 24h
