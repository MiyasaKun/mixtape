include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - install
  - test
  - security
  - image

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  tags:
    - saas-linux-small-amd64

frontend-deps:
  stage: install
  image: oven/bun:1.3.14-alpine
  script:
    - cd template
    - bun install --frozen-lockfile
    - bun run build
  artifacts:
    paths:
      - template/build/
    expire_in: 1 hour
  cache:
    key:
      files:
        - template/bun.lock
    paths:
      - template/node_modules/
    policy: pull-push

go-test:
  stage: test
  image: golang:1.27.0-alpine3.24
  needs:
    - job: frontend-deps
      artifacts: true
  script:
    - go test ./...
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/go-build/
      - .cache/go-mod/
    policy: pull-push
  variables:
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod

secret_detection:
  stage: security

docker-image:
  stage: image
  image: docker:24.0.5-cli
  services:
    - name: docker:24.0.5-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - until docker info >/dev/null 2>&1; do sleep 1; done
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker run --privileged --rm tonistiigi/binfmt:qemu-v8.1.5 --install all
    - docker buildx create --name multiarch-builder --driver docker-container --use
    - docker buildx inspect --bootstrap
  script:
    - |
      tags="--tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        tags="$tags --tag $CI_REGISTRY_IMAGE:latest"
      fi
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --pull \
        --provenance=false \
        --sbom=false \
        $tags \
        --push \
        .
      docker buildx imagetools inspect "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
