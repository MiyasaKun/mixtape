include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - install
  - test
  - security
  - image
  - terraform-validate
  - terraform-server
  - terraform-plan
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  tags:
    - saas-linux-small-amd64

frontend-deps:
  stage: install
  image: oven/bun:1.3.14-alpine
  script:
    - cd template
    - bun install --frozen-lockfile
    - bun run build
  artifacts:
    paths:
      - template/build/
    expire_in: 1 hour
  cache:
    key:
      files:
        - template/bun.lock
    paths:
      - template/node_modules/
    policy: pull-push

go-test:
  stage: test
  image: golang:1.27.0-alpine3.24
  needs:
    - job: frontend-deps
      artifacts: true
  script:
    - go test ./...
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/go-build/
      - .cache/go-mod/
    policy: pull-push
  variables:
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod

secret_detection:
  stage: security

docker-image:
  stage: image
  image: docker:24.0.5-cli
  services:
    - name: docker:24.0.5-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - until docker info >/dev/null 2>&1; do sleep 1; done
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker run --privileged --rm tonistiigi/binfmt:qemu-v8.1.5 --install all
    - docker buildx create --name multiarch-builder --driver docker-container --use
    - docker buildx inspect --bootstrap
  script:
    - |
      tags="--tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        tags="$tags --tag $CI_REGISTRY_IMAGE:latest"
      fi
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --pull \
        --provenance=false \
        --sbom=false \
        $tags \
        --push \
        .
      docker buildx imagetools inspect "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

.terraform-backend:
  image: hashicorp/terraform:1.16.0
  variables:
    TF_HTTP_USERNAME: gitlab-ci-token
    TF_HTTP_PASSWORD: $CI_JOB_TOKEN
    TF_HTTP_LOCK_METHOD: POST
    TF_HTTP_UNLOCK_METHOD: DELETE
    TF_HTTP_RETRY_WAIT_MIN: "5"

.terraform-deploy:
  extends: .terraform-backend
  before_script:
    - apk add --no-cache openssh-client
    - install -d -m 700 "$CI_PROJECT_DIR/.ssh"
    - cp "$DEPLOY_SSH_PRIVATE_KEY" "$CI_PROJECT_DIR/.ssh/deploy_key"
    - cp "$DEPLOY_SSH_CERTIFICATE" "$CI_PROJECT_DIR/.ssh/deploy_key-cert.pub"
    - cp "$DEPLOY_KNOWN_HOSTS" "$CI_PROJECT_DIR/.ssh/known_hosts"
    - chmod 600 "$CI_PROJECT_DIR/.ssh/deploy_key" "$CI_PROJECT_DIR/.ssh/deploy_key-cert.pub" "$CI_PROJECT_DIR/.ssh/known_hosts"
    - export TF_HTTP_ADDRESS="$CI_API_V4_URL/projects/$CI_PROJECT_ID/terraform/state/production-server"
    - export TF_HTTP_LOCK_ADDRESS="$TF_HTTP_ADDRESS/lock"
    - export TF_HTTP_UNLOCK_ADDRESS="$TF_HTTP_ADDRESS/lock"
    - terraform -chdir=infra/server init -reconfigure
    - export TF_VAR_deploy_host="$(terraform -chdir=infra/server output -raw ipv4_address)"
    - export TF_VAR_ssh_identity_file="$CI_PROJECT_DIR/.ssh/deploy_key"
    - export TF_VAR_ssh_certificate_file="$CI_PROJECT_DIR/.ssh/deploy_key-cert.pub"
    - export TF_VAR_ssh_known_hosts_file="$CI_PROJECT_DIR/.ssh/known_hosts"
    - export TF_VAR_registry_address="$CI_REGISTRY"
    - export TF_VAR_registry_username="$REGISTRY_DEPLOY_USER"
    - export TF_VAR_registry_password="$REGISTRY_DEPLOY_PASSWORD"
    - export TF_VAR_image="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - export TF_HTTP_ADDRESS="$CI_API_V4_URL/projects/$CI_PROJECT_ID/terraform/state/production"
    - export TF_HTTP_LOCK_ADDRESS="$TF_HTTP_ADDRESS/lock"
    - export TF_HTTP_UNLOCK_ADDRESS="$TF_HTTP_ADDRESS/lock"
    - terraform -chdir=infra/docker init -reconfigure
    - |
      attempts=0
      until ssh -p "${TF_VAR_deploy_port:-22}" -i "$TF_VAR_ssh_identity_file" -o "CertificateFile=$TF_VAR_ssh_certificate_file" -o IdentitiesOnly=yes -o "UserKnownHostsFile=$TF_VAR_ssh_known_hosts_file" -o StrictHostKeyChecking=yes -o BatchMode=yes "${TF_VAR_deploy_user:-mixtape-deploy}@${TF_VAR_deploy_host}" docker info >/dev/null; do
        attempts=$((attempts + 1))
        if [ "$attempts" -ge 30 ]; then
          exit 1
        fi
        sleep 10
      done

terraform-validate:
  extends: .terraform-backend
  stage: terraform-validate
  script:
    - terraform fmt -check -recursive infra
    - terraform -chdir=infra/docker init -backend=false
    - terraform -chdir=infra/docker validate
    - terraform -chdir=infra/server init -backend=false
    - terraform -chdir=infra/server validate
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

terraform-server-plan:
  extends: .terraform-backend
  stage: terraform-server
  variables:
    TF_HTTP_ADDRESS: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/terraform/state/production-server"
    TF_HTTP_LOCK_ADDRESS: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/terraform/state/production-server/lock"
    TF_HTTP_UNLOCK_ADDRESS: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/terraform/state/production-server/lock"
  script:
    - terraform -chdir=infra/server init -reconfigure
    - terraform -chdir=infra/server plan -out=server.tfplan
  artifacts:
    access: developer
    expire_in: 1 day
    paths:
      - infra/server/server.tfplan
  resource_group: production-server
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

terraform-server-apply:
  extends: .terraform-backend
  stage: terraform-server
  variables:
    TF_HTTP_ADDRESS: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/terraform/state/production-server"
    TF_HTTP_LOCK_ADDRESS: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/terraform/state/production-server/lock"
    TF_HTTP_UNLOCK_ADDRESS: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/terraform/state/production-server/lock"
  script:
    - terraform -chdir=infra/server init -reconfigure
    - terraform -chdir=infra/server apply -input=false server.tfplan
  needs:
    - job: terraform-server-plan
      artifacts: true
  resource_group: production-server
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual

terraform-deploy-plan:
  extends: .terraform-deploy
  stage: terraform-plan
  script:
    - terraform -chdir=infra/docker plan -out=tfplan
  artifacts:
    access: developer
    expire_in: 1 day
    paths:
      - infra/docker/tfplan
  resource_group: production
  needs:
    - job: docker-image
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

terraform-deploy-apply:
  extends: .terraform-deploy
  stage: deploy
  script:
    - terraform -chdir=infra/docker apply -input=false tfplan
  resource_group: production
  environment:
    name: production
  needs:
    - job: terraform-deploy-plan
      artifacts: true
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
